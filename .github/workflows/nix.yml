name: nix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # One runner per system the flake claims: x86_64-linux, aarch64-linux and
        # aarch64-darwin. Claiming one that nothing builds is how a platform stays
        # broken without anybody hearing about it.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Builds both NativeAOT apps, runs the corpus and the purity gate.
      - name: Flake check
        run: nix flake check --print-build-logs

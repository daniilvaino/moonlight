name: nuget

# Packs the nine managed libraries and, after a manual approval, publishes them.
# Per the release plan this is the future `managed` job of release.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # builds and checks everything, publishes nothing

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The version lives in Directory.Build.props; the tag, Program.cs and
      # flake.nix must agree with it. A mismatch is not a release.
      - name: Version
        run: |
          props=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "${{ github.event_name }}" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$props" ] || { echo "tag $tag != Directory.Build.props $props"; exit 1; }
          fi
          grep -qF "moonlight $props\"" apps/Cli/Program.cs || { echo "Program.cs != $props"; exit 1; }
          grep -qF "version = \"$props\"" flake.nix         || { echo "flake.nix != $props"; exit 1; }
          echo "VERSION=$props" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Moonlight.slnx
      - name: Build
        run: dotnet build Moonlight.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Moonlight.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack Moonlight.slnx -c Release --no-build -o out/nuget

      - name: Exactly nine packages
        run: |
          ls out/nuget
          [ "$(ls out/nuget/*.nupkg  | wc -l)" -eq 9 ] || { echo "expected 9 .nupkg";  exit 1; }
          [ "$(ls out/nuget/*.snupkg | wc -l)" -eq 9 ] || { echo "expected 9 .snupkg"; exit 1; }

      # A clean project outside the repository installs Moonlight.Core.Http from
      # the local feed: all nine must resolve, compile and load.
      - name: Consumption test
        run: |
          dir=$(mktemp -d)
          cp -r out/nuget "$dir/feed"
          cd "$dir"
          dotnet new console -n Consume -o consume
          cd consume
          cat > nuget.config <<EOF
          <configuration><packageSources><clear />
            <add key="local" value="$dir/feed" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources></configuration>
          EOF
          dotnet add package Moonlight.Core.Http --version "$VERSION"
          cat > Program.cs <<'EOF'
          System.Console.WriteLine(typeof(Moonlight.Core.Http.HttpSync).Assembly.GetName().Version);
          System.Console.WriteLine(typeof(Moonlight.Core.SyncEngine).Assembly.GetName().Version);
          EOF
          dotnet run

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: out/nuget/
          if-no-files-found: error

  publish:
    needs: pack
    if: github.event_name == 'push'     # tags only; a dispatch run publishes nothing
    runs-on: ubuntu-latest
    environment: nuget                   # required reviewer: the approval gate
    permissions:
      contents: read
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # v8 no longer unpacks what it downloads, hence v7.
      - uses: actions/download-artifact@v7
        with:
          name: nuget
          path: out/nuget

      # .snupkg beside each .nupkg is pushed along with it. --skip-duplicate makes
      # a re-run after a partial failure safe.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "out/nuget/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

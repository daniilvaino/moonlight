name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # arm64 is not a nicety: macos-latest is Apple silicon and ubuntu-24.04-arm
        # covers the linux-arm64 the flake claims to support, which nothing built
        # before this.
        #
        # win-arm64 is here because a release ships it. A platform that is only ever
        # built on release day is a platform whose first failure happens with a tag
        # already pushed — and this one has somewhere specific to fail, since
        # NativeAOT links through MSVC and needs the arm64 build tools present.
        #
        # The identifier is spelled out because a shared library needs one given:
        # publishing an application infers it, publishing a NativeLib refuses to.
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Moonlight.slnx

      - name: Build
        run: dotnet build Moonlight.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Moonlight.slnx --no-build -c Release

      - name: Publish NativeAOT
        run: |
          dotnet publish apps/Cli -c Release
          dotnet publish apps/Tui -c Release
          dotnet publish src/Core.Abi -c Release -r ${{ matrix.rid }}

      # The managed tests exercise the room behind the door; only this opens the
      # door. It loads the shared library that was just built, looks up every
      # function moonlight.h declares, and drives a sweep through them — so a
      # renamed entry point or a header that has drifted fails here rather than in
      # somebody else's application.
      - name: Check the C interface
        shell: bash
        run: |
          library=$(find src/Core.Abi/bin/Release -path '*/native/*' \
            \( -name 'Moonlight.Core.Abi.dll' -o -name 'Moonlight.Core.Abi.so' -o -name 'Moonlight.Core.Abi.dylib' \) \
            | head -1)
          test -n "$library" || { echo "no shared library was published"; exit 1; }
          dotnet run --project tests/Abi.Native -c Release -- "$library" src/Core.Abi/moonlight.h

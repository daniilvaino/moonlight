name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Moonlight.slnx

      - name: Build
        run: dotnet build Moonlight.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Moonlight.slnx --no-build -c Release

      - name: Publish NativeAOT
        run: |
          dotnet publish apps/Cli -c Release
          dotnet publish apps/Tui -c Release

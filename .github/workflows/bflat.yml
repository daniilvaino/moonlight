name: bflat

on:
  push:
    branches: [main]
  pull_request:

# The third build mode. Without this it exists only in a document, and a document
# is not a build: bflat has its own compiler, so anything the language does that it
# has not caught up with breaks here and nowhere else.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    env:
      BFLAT_VERSION: 8.0.2

      # So the object writer beside the compiler is found. Its own dependencies are
      # a separate matter — see the step that installs them.
      LD_LIBRARY_PATH: ${{ github.workspace }}/bflat

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # bflat's object writer links against libc++, and the release does not carry a
      # complete one: the x64 archive ships libc++.so.1 without libc++abi.so.1, and
      # the arm64 archive ships neither. Missing either is reported as the object
      # writer itself being missing, which reads like a broken download.
      - name: The C++ runtime bflat links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libc++1 libc++abi1 \
            || sudo apt-get install -y --no-install-recommends libc++1-18 libc++abi1-18

      # And the arm64 lld wants libtinfo.so.5 — the x64 one references no such
      # library, which is why only one architecture ever failed on this. Ubuntu 24.04
      # ships only ncurses 6, and pointing a symlink at it is not enough: the loader
      # then refuses with NCURSES_TINFO_5.0.19991023 not found, because the symbols
      # are versioned. The real compatibility package is still in the archive.
      #
      # bflat offers no way to use a different linker, only --ldflags, so the library
      # has to be there.
      - name: The libtinfo bflat's linker was built against
        if: matrix.arch == 'arm64'
        run: |
          if ! sudo apt-get install -y --no-install-recommends libtinfo5 2>/dev/null; then
            deb=libtinfo5_6.3-2_arm64.deb
            curl -fsSLO "http://ports.ubuntu.com/ubuntu-ports/pool/universe/n/ncurses/$deb"
            sudo dpkg -i "$deb"
          fi
          ldconfig -p | grep 'libtinfo\.so\.5'

      - name: Cache bflat
        id: cache
        uses: actions/cache@v4
        with:
          path: bflat
          key: bflat-${{ env.BFLAT_VERSION }}-linux-${{ matrix.arch }}

      - name: Fetch bflat
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p bflat
          curl -sSL -o bflat.tar.gz \
            "https://github.com/bflattened/bflat/releases/download/v${BFLAT_VERSION}/bflat-${BFLAT_VERSION}-linux-glibc-${{ matrix.arch }}.tar.gz"
          tar -xzf bflat.tar.gz -C bflat

      # The archive is flat, so the compiler is bflat/bflat. Restoring from cache
      # does not always keep the mode bit, and a compiler that is merely not
      # executable fails in a way that reads like a missing download.
      - name: Check bflat is there
        run: |
          chmod +x bflat/bflat
          ./bflat/bflat --info | head -3

      # What ImplicitUsings would have generated, and the aliases TerminalGui.props
      # declares. bflat runs no MSBuild, so nothing generates them.
      - name: Global usings
        run: |
          cat > GlobalUsings.cs <<'EOF'
          global using System;
          global using System.Collections.Generic;
          global using System.IO;
          global using System.Linq;
          global using System.Net.Http;
          global using System.Threading;
          global using System.Threading.Tasks;
          global using BitArray = System.Collections.BitArray;
          global using System.Globalization;
          global using System.Text;
          global using System.Text.RegularExpressions;
          EOF

      - name: The linkable library
        run: |
          ./bflat/bflat build \
            $(find src -name '*.cs' -not -path '*/obj/*' -not -path '*/bin/*' -not -path '*/Core.Http/*') \
            GlobalUsings.cs \
            --target Shared -o libmoonlight.so \
            --stdlib DotNet --no-reflection --no-globalization --no-stacktrace-data
          ls -l libmoonlight.so

      # The same check the NativeAOT build gets, against the bflat artifact: the two
      # are different compilers and only one of them is exercised by anything else.
      - name: Check the C interface
        run: dotnet run --project tests/Abi.Native -c Release -- libmoonlight.so src/Core.Abi/moonlight.h

      - name: The command line
        run: |
          ./bflat/bflat build \
            $(find src apps/Cli -name '*.cs' -not -path '*/obj/*' -not -path '*/bin/*' -not -path '*/Core.Abi/*') \
            GlobalUsings.cs \
            -o moonlight \
            --stdlib DotNet --no-reflection --no-globalization --no-stacktrace-data
          ./moonlight version

      # Terminal.Gui uses C# 14 extension members, which bflat's own compiler is too
      # old to parse. The language moved and the IL did not, so it is built with our
      # SDK and handed over as an assembly.
      - name: The terminal interface
        run: |
          dotnet build apps/Tui/Vendor/TerminalGui -c Release
          ./bflat/bflat build \
            $(find src apps/Tui -name '*.cs' -not -path '*/obj/*' -not -path '*/bin/*' \
                   -not -path '*/Core.Abi/*' -not -path 'apps/Tui/Vendor/*') \
            GlobalUsings.cs \
            -r apps/Tui/Vendor/TerminalGui/bin/Release/net8.0/Moonlight.Vendor.TerminalGui.dll \
            -o moonlight-tui \
            --stdlib DotNet --no-reflection --no-globalization --no-stacktrace-data
          ls -l moonlight-tui

      - name: Sizes
        run: ls -l libmoonlight.so moonlight moonlight-tui
